<!DOCTYPE html>
<html>
<head>
    <title>Table Layout</title>
    <style>
        table{
            width:100%;
            height:100vh;
            color: white;
            background-color: black;
            border-collapse:collapse;
            border:2px solid white;  
        }
        td{
            border:2px solid white;
            padding:15px;
             border:2px solid white;
        }
        .header{
            height:50px;
            color: white;
        }
        .main{
            height:250px;
            text-align:center;
        }
        .box{
    width:150px;
    height:150px;
    background-color:blue;
    color:white;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
}
        .footer{
            height:50px;
            
        }
    </style>
</head>
<body>

<table>

    <!-- Header -->
    <tr class="header">
        <td>Logo</td>
        <td align="right">
            <a href="#">Link</a>
        </td>
    </tr>

    <!-- Main -->
    <tr class="main">
        <td>
            <div class="box">
                Square Box
            </div>
        </td>

        <td>
            <div class="box">
                Square Box
            </div>
        </td>
    </tr>

    <!-- Footer -->
    <tr class="footer">
        <td>Footer 1</td>
        <td align="right">Footer 2</td>
    </tr>

</table>

</body>
</html>
