<!DOCTYPE html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content ="width=device-width, initial-scale=1.0" />
    <meta name="Author" content="Mayank Garg" />
    <title>Flex Box</title>
    <link rel="stylesheet" href="" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
*{
    margin:0;
    padding :0;
    box-sizing:border-box;

}
.fc{

    display: flex;
    gap: 10px;
    flex-direction: row;
    /* justify-content: flex-start; */
    /* justify-content: flex-end; */
    justify-content: center;
    /* align-items: flex-start; */
    /* align-items: flex-end; */
    align-items: center;
}
body{
    min-height: 100vh;
    font-family:'Poppins', sans-serif;;
    font-size: 16px;
    background-color: white;
    color:black;
}
section{
    padding: 10px;
}
.box{
    background-color: darkred;
}
</style>
</head>
<body>
<section class="box" style="height: 10vh">Reader/NAvbar</section>
<section class="fc" style="height: 80vh; background-color: white;">
    <main class="box" style="height:150px; width:200px; padding: 10px">Main-1</main>
    <main class="box" style="height: 150px; width: 200px;padding: 10px">Main-2</main>
</section>
<section
class="box" style="position: absolute; bottom:0;left:0; height:10vh;width: 100%;">  FOOTER</section>
<script></script>
</body>
</html>
