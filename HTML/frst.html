<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Practice</title>
    <style>
        .fcx {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <header class="fcx">
        &#9814;
    </header>

    <main>
        <h3>List1</h3>

        <ul id="u1">
            <li>One</li>
            <li>Two</li>
            <li>Three</li>
        </ul>

        <h3>List2</h3>

        <ul id="u2">
            <li>Four</li>
            <li>Five</li>
            <li>Six</li>
        </ul>
    </main>

    <footer class="fcx">
        &#9814;
    </footer>

    <script>
        var vl = document.getElementsByTagName("ul");
        var ul = document.querySelectorAll("ul");

        let ul0 = ul[0].firstElementChild;

        ul0.style.fontSize = "1.5rem";
        ul0.nextElementSibling.style.backgroundColor = "yellow";

        ul[1].style.backgroundColor = "lightgreen";

        console.log(vl);
        console.log(ul);
    </script>

</body>
</html>
