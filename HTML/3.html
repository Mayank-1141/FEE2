<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Boxes</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            box-sizing:margin-box;
            border-box:content-box;
        }
        section{
            width:calc(200px - 40px);
            height:calc(200px -40px);
            padding:25px;
            margin:20px;
            border:5px solid white;
            color:white;
            /* overflow:auto; */
        }
        #s1{
            background-color:cyan;
            color:black;
        }
        #s2{
            background-color:coral;
            color:black;
        }
    </style>
</head>
<body>

<section id="s1">
   Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ratione itaque provident unde minimminima. 
</section>
<section id="s2">
    Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptate blanditiis itaque nulla ex alias expedita ipsa maxime.
</section>
</body>
</html>
