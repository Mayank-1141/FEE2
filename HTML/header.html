<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>center above</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#2d2d2d;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

section{
    width:800px;
    height:500px;
    background:#3a3a3a;
    border:2px solid #bdbdbd;
}

header{
    height:70px;
    display:flex;
    border-bottom:2px solid #bdbdbd;
}

header h2,
nav{
    flex:1;
    color:white;
    padding:20px;
}

header h2{
    border-right:2px solid #bdbdbd;
    font-size:22px;
}

nav{
    border-left:2px solid #bdbdbd;
    font-size:22px;
}

main{
    height:360px;
    display:flex;
    justify-content:center;
    align-items:center;
}

article{
    display:flex;
    flex-direction:column;
    gap:12px;
}

article p{
    width:250px;
    height:110px;
    background:#27a8ff;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

footer{
    height:70px;
    display:flex;
    border-top:2px solid #bdbdbd;
}

footer p{
    flex:1;
    color:white;
    padding:20px;
}

footer p:first-child{
    border-right:2px solid #bdbdbd;
}
</style>
</head>

<body>

<section>

<header>
    <h2>Logo</h2>
    <nav>Links</nav>
</header>

<main>
    <article>
        <p>Bigger Rectangular Box</p>
        <p>Bigger Rectangular Box</p>
    </article>
</main>

<footer>
    <p>Footer1</p>
    <p>Footer2</p>
</footer>

</section>

</body>
</html>
