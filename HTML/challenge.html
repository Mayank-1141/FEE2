<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="Author" content="Mayank Garg" />
    <meta name="Description" content="create login form with semantic HTML tags" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design </title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Courage&family=Roboto:wght@100&display=swap');
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background:rgb(74, 65, 65);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
}
.main{
    width:600px;
}
.section{
    border:2px solid white;
    padding:40px;
    margin-bottom:30px;
}
.top{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}
.middle{
    display:flex;
    gap:20px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(2,80px);
    gap:20px;
    justify-content:center;
    margin-top:20px;
}
.box{
    width:80px;
    height:40px;
    background:blue;
    border-radius:8px;
}
p{
    color:white;
    margin-bottom:10px;
}
</style>
</head>
<body>
<div class="main">
    <div class="section top">
        <div class="box"></div>
        <div class="middle">
            <div class="box"></div>
            <div class="box"></div>
        </div>
        <div class="box"></div>
    </div>
</div>
</body>
</html>
