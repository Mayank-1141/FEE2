<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adjacent top bottom box</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#2b2b2b;
    display:flex;
    justify-content:center;
    padding:30px;
}

article{
    width:900px;
    border:2px solid white;
}

header{
    display:flex;
    height:80px;
}

header section,
header nav{
    flex:1;
    border:1px solid white;
    color:white;
    display:flex;
    align-items:center;
    padding-left:15px;
    font-size:22px;
    font-weight:bold;
}

main{
    height:420px;
    border:1px solid white;
    position:relative;
}

.left-box{
    width:180px;
    height:100px;
    background:blue;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:absolute;
    top:30px;
    left:20px;
    font-weight:bold;
}

.right-box{
    width:180px;
    height:100px;
    background:blue;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:absolute;
    right:20px;
    bottom:30px;
    font-weight:bold;
}

footer{
    display:flex;
    height:70px;
}

footer section{
    flex:1;
    border:1px solid white;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    font-weight:bold;
}
</style>

</head>
<body>

<article>

<header>
    <section>Logo</section>
    <nav>Links</nav>
</header>

<main>
    <section class="left-box">Left Top Corner Box</section>
    <section class="right-box">Right Bottom Corner Box</section>
</main>

<footer>
    <section>Footer 1</section>
    <section>Footer 2</section>
</footer>

</article>

</body>
</html>
