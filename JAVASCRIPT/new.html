<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <style>
        .darkTheme{
            background-color: black;
            color: white;
        }
        .darkTheme .card {
        background-color: #222;
        color: white;
        border-color: white;
    }
    </style>
</head>
<body>
    <header>
    <button id="btn1">Dark Theme</button>
    </header>
    <section class="card">Dance upon a time</section>
<script>
    const btn1=document.querySelector("#btn1");

    btn1.addEventListener("click",cbf);
    function cbf(){
        document.body.classList.toggle("darkTheme");
        if(btn1.textContent==="Dark Theme"){
            btn1.textContent="Light Theme";
        } else {
            btn1.textContent="Dark Theme";
        }
    }
</script>
